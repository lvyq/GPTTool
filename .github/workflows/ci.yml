name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run check --prefix frontend
      - run: npm run build:backend
      - run: npm run build:web
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gpttool-web
          path: frontend/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gpttool-api
          path: backend/dist/
          if-no-files-found: error
      - name: Reject production secrets and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env|.*initial-admin.*|DEPLOYED\.md)$'
          ! git ls-files | grep -E '\.(dmg|exe|msi|p12|pfx|pem|key|sqlite|db)$'
          ! git grep -nE 'BEGIN ([A-Z0-9]+ )?PRIVATE KEY'

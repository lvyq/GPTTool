name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix deploy/relay-server
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Reject production secrets and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env|.*initial-admin.*|DEPLOYED\.md)$'
          ! git ls-files | grep -E '\.(dmg|exe|msi|p12|pfx|pem|key|sqlite|db)$'
          ! git grep -nE 'BEGIN ([A-Z0-9]+ )?PRIVATE KEY'
